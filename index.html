<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=login.html">
    <title>AuraHealth Enterprise Gateway</title>
    <link rel="stylesheet" href="ui.apps/src/main/content/jcr_root/apps/healthcare/clientlibs/clientlib-site/css/site.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 1.5rem;
            box-sizing: border-box;
            color: #ffffff;
        }
        .hub-card {
            background: #ffffff;
            color: #1e293b;
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .hub-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #0f172a;
        }
        .hub-sub {
            color: #64748b;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .hub-links {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }
        .hub-btn {
            display: block;
            padding: 0.85rem 1.25rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: #0284c7;
            color: #ffffff;
        }
        .btn-primary:hover {
            background: #0369a1;
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #e2e8f0;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="hub-card">
        <h1 class="hub-title">AuraHealth Management</h1>
        <p class="hub-sub">Redirecting to login portal...</p>
        <div class="hub-links">
            <a href="login.html" class="hub-btn btn-primary">Go to Login Portal</a>
            <a href="doctor-portal.html" class="hub-btn btn-secondary">Doctor Portal Directly</a>
            <a href="patient-portal.html" class="hub-btn btn-secondary">Patient Portal Directly</a>
        </div>
    </div>
    <script>
        window.location.replace("login.html");
    </script>
</body>
</html>
