<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=login.html">
    <title>AuraHealth Medical System</title>
    <link rel="stylesheet" href="ui.apps/src/main/content/jcr_root/apps/healthcare/clientlibs/clientlib-site/css/site.css">
    <style>
        body {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
            color: #0f172a;
        }
        .hub-card {
            background: #ffffff;
            color: #0f172a;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            max-width: 460px;
            width: 100%;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            text-align: center;
        }
        @media (min-width: 640px) {
            .hub-card {
                padding: 2.25rem;
            }
        }
        .hub-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background: #0f52ba;
            color: #ffffff;
            border-radius: 8px;
            margin-bottom: 0.75rem;
        }
        .hub-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin: 0 0 0.35rem 0;
            color: #0f172a;
            letter-spacing: -0.01em;
        }
        .hub-sub {
            color: #64748b;
            margin-bottom: 1.75rem;
            font-size: 0.875rem;
        }
        .hub-links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .hub-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.15s ease;
            min-height: 44px;
        }
        .btn-primary {
            background: #0f52ba;
            color: #ffffff;
        }
        .btn-primary:hover {
            background: #0c4194;
        }
        .btn-secondary {
            background: #ffffff;
            color: #0f172a;
            border: 1px solid #cbd5e1;
        }
        .btn-secondary:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="hub-card">
        <div class="hub-logo">
            <svg class="hc-icon hc-icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M2 12h20"/></svg>
        </div>
        <h1 class="hub-title">AuraHealth Medical System</h1>
        <p class="hub-sub">Connecting to clinical & patient portal gateway...</p>
        <div class="hub-links">
            <a href="login.html" class="hub-btn btn-primary">Proceed to Sign In</a>
            <a href="doctor-portal.html" class="hub-btn btn-secondary">Physician Workspace</a>
            <a href="patient-portal.html" class="hub-btn btn-secondary">Patient Health Portal</a>
        </div>
    </div>
    <script>
        window.location.replace("login.html");
    </script>
</body>
</html>
