<div class="cmp-appointment-booking" id="appointmentBookingSection">
    <div class="booking-card">
        <div class="booking-header">
            <h3>Schedule a Consultation</h3>
            <p>Connect with a healthcare professional in clinic or via telehealth.</p>
        </div>

        <form id="appointmentForm" class="booking-form" onsubmit="HealthcareApp.submitBooking(event)">
            <div class="form-row">
                <div class="form-group">
                    <label for="patientName">Patient Full Name *</label>
                    <input type="text" id="patientName" name="patientName" required class="hc-input" placeholder="e.g. Eleanor Vance"/>
                </div>
                <div class="form-group">
                    <label for="patientEmail">Email Address *</label>
                    <input type="email" id="patientEmail" name="patientEmail" required class="hc-input" placeholder="patient@example.com"/>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="departmentSelect">Specialty / Department *</label>
                    <select id="departmentSelect" name="department" class="hc-select" onchange="HealthcareApp.updateDoctorOptions()">
                        <option value="Cardiology">Cardiology</option>
                        <option value="Neurology">Neurology</option>
                        <option value="Pediatrics">Pediatrics</option>
                        <option value="Orthopedics">Orthopedics & Sports Medicine</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="doctorSelect">Assigned Doctor *</label>
                    <select id="doctorSelect" name="doctorId" class="hc-select">
                        <option value="DOC-001">Dr. Sarah Jenkins, MD</option>
                        <option value="DOC-002">Dr. Marcus Chen, DO</option>
                        <option value="DOC-003">Dr. Aliyah Patel, MD</option>
                        <option value="DOC-004">Dr. Robert Rodriguez, MD</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="apptDate">Preferred Date *</label>
                    <input type="date" id="apptDate" name="date" required class="hc-input"/>
                </div>
                <div class="form-group">
                    <label for="apptTime">Preferred Time Slot *</label>
                    <select id="apptTime" name="timeSlot" class="hc-select">
                        <option value="09:00 AM">09:00 AM - 09:45 AM</option>
                        <option value="10:30 AM">10:30 AM - 11:15 AM</option>
                        <option value="02:00 PM">02:00 PM - 02:45 PM</option>
                        <option value="04:00 PM">04:00 PM - 04:45 PM</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="symptoms">Reason for Visit / Symptoms Description</label>
                <textarea id="symptoms" name="symptoms" rows="3" class="hc-textarea" placeholder="Briefly describe your symptoms or reason for visit..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="btnSubmitBooking">Confirm Appointment</button>
            </div>
        </form>

        <div id="bookingResultNotification" class="alert-box" style="display:none;"></div>
    </div>
</div>
